<!--
  EchoSphere signup form for naru-m.com (Squarespace).
  Paste into a Code Block (Edit page → + → Code, mode HTML, "Display Source" off).
  Replace WEB_APP_URL below with the Apps Script web app's /exec URL.
  Squarespace runs scripts in Code Blocks on Core/Business plans and above.
-->
<form id="es-signup" class="es-signup" novalidate>
  <input type="email" name="email" placeholder="Your email" required autocomplete="email" aria-label="Email">
  <input type="text" name="first_name" placeholder="First name (optional)" autocomplete="given-name" aria-label="First name">
  <!-- Honeypot: hidden from people, filled in by bots. -->
  <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"
         style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
  <button type="submit">Sign up</button>
  <p class="es-msg" role="status" aria-live="polite"></p>
  <p class="es-fine">We'll email you EchoSphere updates. Unsubscribe anytime.</p>
</form>

<style>
  .es-signup { display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px; position: relative; }
  .es-signup input[type=email], .es-signup input[type=text]:not([name=website]) {
    flex: 1 1 200px; padding: 12px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;
  }
  .es-signup button {
    padding: 12px 24px; border: 0; border-radius: 8px; background: #7b4ed6; color: #fff; font-size: 16px; cursor: pointer;
  }
  .es-signup button:disabled { opacity: .6; cursor: default; }
  .es-msg { flex-basis: 100%; margin: 4px 0 0; min-height: 1.2em; }
  .es-fine { flex-basis: 100%; margin: 0; font-size: 12px; color: #888; }
</style>

<script>
(function () {
  var WEB_APP_URL = 'PASTE_WEB_APP_EXEC_URL_HERE';
  var form = document.getElementById('es-signup');
  var msg = form.querySelector('.es-msg');
  var btn = form.querySelector('button');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = form.email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      msg.textContent = 'Please enter a valid email address.';
      return;
    }
    btn.disabled = true;
    msg.textContent = 'Signing you up…';

    var body = new URLSearchParams({
      email: email,
      first_name: form.first_name.value.trim(),
      website: form.website.value,
      source: 'naru-m.com' + location.pathname
    });

    // Apps Script web apps don't send CORS headers, so the response can't be
    // read from the browser ("no-cors"). The request still arrives and is
    // validated server-side; the browser check above catches typos.
    fetch(WEB_APP_URL + '?a=signup', { method: 'POST', mode: 'no-cors', body: body })
      .then(function () {
        form.reset();
        msg.textContent = "You're signed up — thank you!";
      })
      .catch(function () {
        msg.textContent = 'Something went wrong. Please try again.';
      })
      .finally(function () { btn.disabled = false; });
  });
})();
</script>
